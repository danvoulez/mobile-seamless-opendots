<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141416">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Open Dots">
  <meta name="format-detection" content="telephone=no">
  <title>Open Dots</title>
  <link rel="manifest" href="{{MANIFEST_HREF}}">
  <link rel="apple-touch-icon" href="/m/icons/icon-180.png">
  <link rel="icon" type="image/svg+xml" href="/m/icons/icon.svg">
  <link rel="stylesheet" href="/m/styles.css">
  <script type="module" src="/m/app.js"></script>
</head>
<body>
  <!-- Mascot gradients, shared by every avatar on the page. -->
  <svg class="defs" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="od-grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#3b82f6"/>
        <stop offset="100%" stop-color="#1d4ed8"/>
      </linearGradient>
      <linearGradient id="od-grad-pink" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f43f5e"/>
        <stop offset="100%" stop-color="#be123c"/>
      </linearGradient>
    </defs>
  </svg>
  <div id="app" class="app"></div>
  <noscript>Open Dots needs JavaScript to continue your conversations.</noscript>
</body>
</html>
